<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divina Lolla — Entrar</title>
  <style>
    :root {
      --primary: #c9a96e;
      --primary-dark: #a07840;
      --primary-light: #f5ede0;
      --danger: #e05252;
      --danger-light: #fdf0f0;
      --bg: #f4f2ef;
      --surface: #ffffff;
      --text: #2c2c2c;
      --text-muted: #888;
      --border: #e0dbd3;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
    }

    .brand { text-align: center; margin-bottom: 26px; }
    .brand .name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .brand .badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      /* 16px evita o zoom automático do iOS ao focar o campo. */
      font-size: 16px;
      background: var(--surface);
      color: var(--text);
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }

    .erro {
      margin-top: 16px;
      padding: 11px 13px;
      background: var(--danger-light);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
      font-size: 0.87rem;
    }

    .hint {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <form class="card" method="post" autocomplete="on">
    <div class="brand">
      <div class="name">Divina Lolla</div>
      <div class="badge">Painel de produtos</div>
    </div>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" autofocus required>

    <button type="submit">Entrar</button>

    {% if erro %}
      <p class="erro">{{ erro }}</p>
    {% endif %}

    <p class="hint">
      Este painel edita o catálogo que aparece no site. Se você não tem a senha,
      fale com o Rafael.
    </p>
  </form>
</body>
</html>
